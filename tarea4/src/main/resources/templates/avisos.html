<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Avisos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<h1>Listado de Avisos</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Fecha publicación</th>
            <th>Sector</th>
            <th>Cantidad Tipo Edad</th>
            <th>Comuna</th>
            <th>Nota</th>
            <th></th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="entry : ${avisos}">
            <td th:text="${entry.key.id}"></td>
            <td th:text="${entry.key.fechaIngreso}"></td>
            <td th:text="${entry.key.sector}"></td>
            <td th:text="${entry.key.cantidad + ' ' + entry.key.tipo + ' ' + entry.key.edad}"></td>
            <td th:text="${entry.key.comuna.nombre}"></td>
            <td th:text="${entry.value == null ? '-' : entry.value}"></td>
            <td>
                <button type="button"
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#modalEvaluar"
                    th:attr="data-id=${entry.key.id}">
                Evaluar
                </button>
            </td>

        </tr>
    </tbody>
</table>
<!-- Modal -->
<div class="modal fade" id="modalEvaluar" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalLabel">Evaluar Aviso</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="formEvaluar" method="post">
        <div class="modal-body">

          <label for="nota" class="form-label">Selecciona una nota (1 - 7):</label>
          <select name="nota" id="nota" class="form-select" required>
              <option value="" disabled selected>Seleccione…</option>
              <option th:each="n : ${#numbers.sequence(1,7)}"
                      th:value="${n}"
                      th:text="${n}"></option>
          </select>

        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Guardar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </form>

    </div>
  </div>
</div>
<script src="/js/modal-evaluar.js"></script>
</body>
</html>
